{% set name = "sphinx-design" %}
{% set version = "0.8.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/executablebooks/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 36306b6b0dd24ab877bb5259edb3e860fc907d5b078cd7db9b3a5907427c59e3

build:
  number: 0
  script:
    - {{ PYTHON }} -m pip install . -vv
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - flit-core >=3.4,<5
  run:
    - python >={{ python_min }}
    - sphinx >=7.2,<10

test:
  requires:
    - myst-parser >=4,<6
    - pytest >=8.3,<10.0
    - pytest-cov
    - pytest-regressions
    - defusedxml
    - tinycss2
    - rcssmin
    - python {{ python_min }}
  source_files:
    - tests/
    - tools/
    - sphinx_design/static/
    - style/
  imports:
    - sphinx_design
  commands:
    - pytest tests -vv

about:
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A sphinx extension for designing beautiful, screen-size responsive web components.
  home: https://github.com/executablebooks/sphinx-design
  doc_url: https://sphinx-design.readthedocs.io

extra:
  recipe-maintainers:
    - awvwgk
    - dopplershift
